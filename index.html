<script id="engine">
(function (global) {
'use strict';

/* ---------- CONFIG : paramètres réglementaires à tenir à jour ---------- */
const CONFIG = {
  bareme: { libelle: 'Barème IR 2025 (revenus 2024) — à mettre à jour',
    tranches: [[11497, 0], [29315, 0.11], [83823, 0.30], [180294, 0.41], [Infinity, 0.45]] },
  plafonds: { livretA: 22950, ldds: 12000, lep: 10000, pea: 150000 },
  seuilEndettement: 0.35,           // recommandation HCSF
  moisPrecaution: { cdi: 3, fonctionnaire: 3, cdd: 6, independant: 9, retraite: 3, etudiant: 3, sans_emploi: 6 },
  scoreFuite100: 0.10,              // fuite = 10 % des revenus → score 100
  hypotheseRenegoTelecom: 0.25,
  pdfjs: { lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs', worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs' },
  // Règles d'épargne (repères, à vérifier chaque année)
  peaAnsExo: 5, avAnsFiscalite: 8, avAbattementGains: { seul: 4600, couple: 9200 },
  avTransmission: { avant70: 152500, apres70: 30500 },
  // Hypothèses de rendement annuel brut de frais (illustratives, non garanties)
  rendements: { pessimiste: 2, median: 5, optimiste: 7, securise: 2 },
  // Part actions indicative [horizon][tolérance]
  allocActions: { court: { prudent: 0, equilibre: 0, dynamique: 10 }, moyen: { prudent: 15, equilibre: 35, dynamique: 55 }, long: { prudent: 30, equilibre: 60, dynamique: 85 } }
};

/* ---------- Utils ---------- */
const stripAccents = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const normText = s => ' ' + stripAccents(s).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim() + ' ';
const DAY = 86400000;
const round2 = v => Math.round(v * 100) / 100;
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const std = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const monthKey = d => d.toISOString().slice(0, 7);

function parseAmount(raw) {
  if (raw == null) return NaN;
  if (typeof raw === 'number') return raw;
  let s = String(raw).trim().replace(/[\s  €]/g, '').replace(/EUR/i, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  s = s.replace(/^\+/, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d*\.?\d+$/.test(s)) return NaN;
  const v = parseFloat(s);
  return neg ? -v : v;
}

function parseDate(raw) {
  const s = String(raw || '').trim();
  const mk = (y, mo, d) => (mo < 1 || mo > 12 || d < 1 || d > 31) ? null : new Date(Date.UTC(y, mo - 1, d));
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return mk(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return mk(y, +m[2], +m[1]); }
  return null;
}

/* ---------- Catégorisation (règles par mots-clés, ordre = priorité) ---------- */
// grp : revenu | contrainte | abonnement | courant | frais | epargne
const RULES = [
  { cat: 'frais_evitable', label: 'Frais bancaires évitables', grp: 'frais', kw: ['COMMISSION INTERVENTION', 'COMMISSION D INTERVENTION', 'COMMISSIONS D INTERVENTION', 'COMMISSIONS INTERVENTION', 'AGIOS', 'INTERETS DEBITEURS', 'FRAIS REJET', 'REJET PRLV', 'FRAIS DE REJET', 'FRAIS RETRAIT', 'COMMISSION RETRAIT', 'FRAIS HORS ZONE', 'FRAIS PAIEMENT HORS ZONE EURO', 'FRAIS LETTRE', 'LETTRE INFORMATION'] },
  { cat: 'frais_optimisable', label: 'Frais bancaires (offre/carte)', grp: 'frais', kw: ['COTISATION CARTE', 'COTIS CARTE', 'COTISATION OFFRE', 'FRAIS TENUE', 'TENUE DE COMPTE', 'FRAIS TENUE DE COMPTE', 'COTISATION FORMULE', 'OFFRE GROUPEE', 'FRAIS BANCAIRES', 'ASSURANCE MOYENS DE PAIEMENT'] },
  { cat: 'epargne', label: 'Épargne / virements internes', grp: 'epargne', kw: ['LIVRET A', 'LIVRET', 'LDDS', 'LEP', 'EPARGNE', 'ASSURANCE VIE', 'VIR INTERNE', 'VIREMENT INTERNE', 'PEA', 'PER '] },
  { cat: 'logement', label: 'Logement', grp: 'contrainte', kw: ['LOYER', 'FONCIA', 'NEXITY', 'CITYA', 'ORPI GESTION', 'SYNDIC', 'CHARGES COPRO', 'AQUITANIS', 'DOMOFRANCE', 'OPH'] },
  { cat: 'credit', label: 'Crédits', grp: 'contrainte', kw: ['ECHEANCE PRET', 'ECH PRET', 'PRET IMMO', 'CREDIT IMMO', 'REMBOURSEMENT PRET', 'COFIDIS', 'CETELEM', 'SOFINCO', 'FRANFINANCE', 'ONEY', 'FLOA', 'CA CONSUMER', 'YOUNITED'] },
  { cat: 'energie', label: 'Énergie & eau', grp: 'contrainte', kw: ['EDF', 'ENGIE', 'TOTALENERGIES ELEC', 'TOTAL ENERGIES ELEC', 'ENI GAS', 'OHM ENERGIE', 'EKWATEUR', 'VATTENFALL', 'MINT ENERGIE', 'SUEZ', 'VEOLIA', 'REGAZ', 'EAU DE'] },
  { cat: 'sante', label: 'Mutuelle santé', grp: 'contrainte', kw: ['MUTUELLE', 'HARMONIE', 'MGEN', 'ALAN', 'MALAKOFF', 'AG2R', 'AESIO', 'VIASANTE', 'APICIL', 'KLESIA', 'SWISSLIFE PREVOYANCE'] },
  { cat: 'assurance', label: 'Assurances', grp: 'contrainte', kw: ['AXA', 'MAIF', 'MACIF', 'MATMUT', 'MAAF', 'MMA', 'GMF', 'ALLIANZ', 'GROUPAMA', 'GENERALI', 'ABEILLE', 'LUKO', 'LOVYS', 'ACHEEL', 'DIRECT ASSURANCE', 'OLIVIER ASSURANCE', 'LEOCARE', 'PACIFICA', 'CARDIF', 'APRIL', 'HISCOX', 'ASSURANCE', 'ASSURANCES'] },
  { cat: 'impots', label: 'Impôts & taxes', grp: 'contrainte', kw: ['DGFIP', 'IMPOT', 'IMPOTS', 'TRESOR PUBLIC', 'FINANCES PUBLIQUES', 'TAXE FONCIERE', 'TAXE'] },
  { cat: 'garde', label: 'Garde & scolarité', grp: 'contrainte', kw: ['CRECHE', 'PAJEMPLOI', 'ASSISTANTE MATERNELLE', 'CANTINE', 'PERISCOLAIRE', 'RESTAURATION SCOLAIRE'] },
  { cat: 'transport_abo', label: 'Transport (abonnement)', grp: 'contrainte', kw: ['NAVIGO', 'TBM', 'KEOLIS', 'TRANSDEV', 'RATP', 'TISSEO', 'TCL'] },
  { cat: 'sport', label: 'Sport & loisirs', grp: 'abonnement', kw: ['BASIC FIT', 'FITNESS PARK', 'ON AIR', 'KEEPCOOL', 'NEONESS', 'ORANGE BLEUE', 'CLUB MED GYM', 'STRAVA', 'GYMLIB', 'URBAN SOCCER'] },
  { cat: 'streaming', label: 'Streaming & médias', grp: 'abonnement', kw: ['NETFLIX', 'SPOTIFY', 'DEEZER', 'DISNEY', 'DISNEYPLUS', 'CANAL', 'CANALPLUS', 'PRIME VIDEO', 'AMAZON PRIME', 'AMZN PRIME', 'APPLE TV', 'APPLE MUSIC', 'YOUTUBE PREMIUM', 'YOUTUBE', 'PARAMOUNT', 'HBO MAX', 'CRUNCHYROLL', 'DAZN', 'BEIN', 'MOLOTOV', 'OCS', 'AUDIBLE', 'QOBUZ', 'TIDAL', 'TWITCH'] },
  { cat: 'cloud', label: 'Cloud & logiciels', grp: 'abonnement', kw: ['ICLOUD', 'GOOGLE ONE', 'GOOGLE STORAGE', 'DROPBOX', 'MICROSOFT 365', 'OFFICE 365', 'MICROSOFT', 'ADOBE', 'CANVA', 'OPENAI', 'CHATGPT', 'ANTHROPIC', 'NOTION', 'NORDVPN', 'PROTON', 'SURFSHARK'] },
  { cat: 'presse', label: 'Presse', grp: 'abonnement', kw: ['LE MONDE', 'LIBERATION', 'FIGARO', 'MEDIAPART', 'CAFEYN', 'SUD OUEST', 'L EQUIPE', 'LEQUIPE'] },
  { cat: 'jeux', label: 'Jeux vidéo', grp: 'abonnement', kw: ['PLAYSTATION', 'PSN', 'XBOX', 'NINTENDO', 'GAME PASS'] },
  { cat: 'telecom', label: 'Télécom & internet', grp: 'contrainte', kw: ['ORANGE', 'SOSH', 'SFR', 'RED BY SFR', 'FREE MOBILE', 'FREE TELECOM', 'FREEBOX', 'FREE', 'BOUYGUES', 'BOUYGUES TELECOM', 'B AND YOU', 'LA POSTE MOBILE', 'PRIXTEL', 'SYMA', 'NRJ MOBILE'] },
  { cat: 'alimentation', label: 'Alimentation', grp: 'courant', kw: ['CARREFOUR', 'LECLERC', 'E LECLERC', 'AUCHAN', 'LIDL', 'ALDI', 'INTERMARCHE', 'CASINO', 'MONOPRIX', 'FRANPRIX', 'SUPER U', 'HYPER U', 'U EXPRESS', 'BIOCOOP', 'NETTO', 'GRAND FRAIS', 'PICARD', 'COCCINELLE'] },
  { cat: 'restauration', label: 'Restauration & livraison', grp: 'courant', kw: ['UBER EATS', 'DELIVEROO', 'JUST EAT', 'MCDONALD', 'MCDONALDS', 'BURGER KING', 'KFC', 'RESTAURANT', 'BRASSERIE', 'BOULANGERIE', 'STARBUCKS', 'SUSHI', 'PIZZA'] },
  { cat: 'transport', label: 'Transport & carburant', grp: 'courant', kw: ['TOTAL', 'TOTALENERGIES', 'ESSO', 'BP', 'SHELL', 'AVIA', 'STATION', 'UBER', 'BOLT', 'BLABLACAR', 'SNCF', 'OUIGO', 'PEAGE', 'VINCI AUTOROUTES', 'APRR', 'SANEF', 'PARKING', 'INDIGO'] },
  { cat: 'achats', label: 'Achats divers', grp: 'courant', kw: ['AMAZON', 'AMZN', 'FNAC', 'DARTY', 'CDISCOUNT', 'ZALANDO', 'VINTED', 'IKEA', 'LEROY MERLIN', 'CASTORAMA', 'ACTION', 'PAYPAL', 'DECATHLON', 'APPLE COM'] },
  { cat: 'sante_courant', label: 'Santé (soins)', grp: 'courant', kw: ['PHARMACIE', 'DOCTOLIB', 'MEDECIN', 'DR', 'CABINET', 'LABORATOIRE', 'OPTICIEN'] },
  { cat: 'retrait', label: "Retraits d'espèces", grp: 'courant', kw: ['RETRAIT DAB', 'RETRAIT', 'DAB'] }
];
const CREDIT_RULES = [
  { cat: 'salaire', label: 'Salaires & traitements', kw: ['SALAIRE', 'PAIE', 'REMUNERATION', 'TRAITEMENT', 'ACOMPTE SALAIRE'] },
  { cat: 'pension', label: 'Pensions & retraites', kw: ['PENSION', 'RETRAITE', 'CNAV', 'CARSAT', 'AGIRC', 'ARRCO', 'IRCANTEC', 'CNRACL'] },
  { cat: 'prestations', label: 'Prestations sociales', kw: ['CAF', 'ALLOCATION', 'PRIME ACTIVITE', 'FRANCE TRAVAIL', 'POLE EMPLOI', 'CPAM', 'AMELI'] },
  { cat: 'epargne', label: 'Virements internes', kw: ['VIR INTERNE', 'VIREMENT INTERNE', 'LIVRET', 'EPARGNE'] }
];
const CAT_LABELS = Object.fromEntries([...RULES, ...CREDIT_RULES].map(r => [r.cat, r.label]));
CAT_LABELS.autre = 'Autres dépenses'; CAT_LABELS.autre_credit = 'Autres crédits';
CAT_LABELS.coloc_recu = 'Remboursement coloc (reçu)'; CAT_LABELS.coloc_envoye = 'Remboursement coloc (envoyé)';
const CAT_GRP = Object.fromEntries(RULES.map(r => [r.cat, r.grp]));
const GENERIC_KW = new Set(['ASSURANCE', 'ASSURANCES', 'LOYER', 'TAXE', 'IMPOT', 'IMPOTS', 'MUTUELLE', 'LIVRET', 'EPARGNE', 'RETRAIT', 'DAB', 'STATION', 'RESTAURANT', 'BRASSERIE', 'BOULANGERIE', 'CABINET', 'DR', 'MEDECIN', 'PHARMACIE', 'PARKING', 'EAU DE', 'TRAITEMENT', 'PAIE', 'SALAIRE']);

const has = (n, kw) => n.includes(' ' + kw + ' ');
const NOISE = /\b(PRLV|PRELEVEMENT|SEPA|EUROPEEN|PAIEMENT|PAIEMT|PAR|CARTE|CB|FACT|FACTURE|VIR|VIREMENT|RECU|EMIS|DE|DU|LE|LA|LES|ET|SA|SAS|SARL|FRANCE|FR|REF|ECH|MOTIF|ICS|RUM|MANDAT|X\d+|\d+)\b/g;
function cleanLabel(label) { return normText(label).replace(NOISE, ' ').replace(/\s+/g, ' ').trim(); }

// ctx.colocAliases : mots-clés (ex. TRICOUNT, prénom d'un coloc) qui signalent un remboursement entre colocataires
function categorize(tx, ctx = {}) {
  const n = normText(tx.label);
  for (const a of ctx.colocAliases || []) if (a && has(n, a))
    return { ...tx, cat: tx.amount > 0 ? 'coloc_recu' : 'coloc_envoye', grp: 'partage', merchant: a };
  const rules = tx.amount > 0 ? CREDIT_RULES.map(r => ({ ...r, grp: r.cat === 'epargne' ? 'epargne' : 'revenu' })) : RULES;
  for (const r of rules) for (const kw of r.kw) if (has(n, kw)) {
    const merchant = GENERIC_KW.has(kw) ? (cleanLabel(tx.label).split(' ').slice(0, 3).join(' ') || kw) : kw;
    return { ...tx, cat: r.cat, grp: r.grp, merchant };
  }
  const merchant = cleanLabel(tx.label).split(' ').slice(0, 3).join(' ') || 'INCONNU';

/* ---------- Détection des prélèvements récurrents ---------- */
const PERIODS = [
  { key: 'hebdomadaire', min: 5, max: 9, factor: 52 / 12 },

  { key: 'bimestriel', min: 55, max: 70, factor: 1 / 2 },
  { key: 'trimestriel', min: 80, max: 100, factor: 1 / 3 },

function detectRecurring(txs) {
  const groups = {};

    (groups[t.merchant] = groups[t.merchant] || []).push(t);
  }
  const out = [];
  for (const [merchant, list] of Object.entries(groups)) {
    if (list.length < 2) continue;
    const sorted = [...list].sort((a, b) => a.date - b.date);
    const known = sorted[0].grp === 'abonnement' || sorted[0].grp === 'contrainte';
    if (sorted[0].grp === 'courant' && sorted[0].cat !== 'autre') continue; // courses, resto… : non pertinents
    // dédoublonnage des prélèvements rapprochés (< 5 j) pour calculer le rythme
    const dupes = [], base = [];
    for (const t of sorted) {
      const prev = base[base.length - 1];

      sampleLabel: sorted[sorted.length - 1].label,

/* ---------- Anomalies & plan d'économies ---------- */

  for (const [st, list] of Object.entries(byType)) if (list.length >= 2) {
    const tot = list.reduce((s, r) => s + mp(r), 0), max = Math.max(...list.map(r => mp(r)));
    A.push({ type: 'doublon_assurance', gravite: 'haute', titre: `Doublon d'assurance ${st}`, detail: `${list.map(r => r.merchant).join(' + ')} couvrent apparemment le même risque. Vérifiez les contrats et résiliez le moins couvrant (loi Hamon : résiliable à tout moment après 1 an).`, ids: list.map(r => r.id), gainMensuel: round2(tot - max) });
  }
  // 2. Cumul de services de streaming
  const stream = active.filter(r => r.cat === 'streaming');
  if (stream.length >= 3) {
    const tot = stream.reduce((s, r) => s + mp(r), 0), max = Math.max(...stream.map(r => mp(r)));
    A.push({ type: 'cumul_streaming', gravite: 'moyenne', titre: `${stream.length} services de streaming en parallèle`, detail: `${stream.map(r => r.merchant).join(', ')}. Stratégie de rotation : un seul service actif à la fois, résilié/réactivé selon les séries suivies.`, ids: stream.map(r => r.id), gainMensuel: round2(tot - max) });
  }
  // 3. Stockage cloud multiple
  const cloud = active.filter(r => r.cat === 'cloud' && /ICLOUD|GOOGLE|DROPBOX|MICROSOFT|OFFICE|PROTON/.test(r.merchant));
  if (cloud.length >= 2) {
    const tot = cloud.reduce((s, r) => s + mp(r), 0), max = Math.max(...cloud.map(r => mp(r)));
    A.push({ type: 'doublon_cloud', gravite: 'basse', titre: 'Plusieurs abonnements de stockage en ligne', detail: `${cloud.map(r => r.merchant).join(' + ')} : regroupez vos fichiers sur un seul service.`, ids: cloud.map(r => r.id), gainMensuel: round2(tot - max) });
  }
  // 4. Doubles prélèvements
  for (const r of active) for (const [a, b] of r.dupes) {
    A.push({ type: 'double_prelevement', gravite: 'haute', titre: `Double prélèvement ${r.merchant}`, detail: `${Math.abs(b.amount).toFixed(2)} € prélevés deux fois (${a.date.toLocaleDateString('fr-FR')} et ${b.date.toLocaleDateString('fr-FR')}). Réclamez le remboursement au prestataire ou contestez auprès de la banque.`, ids: [r.id], gainPonctuel: round2(Math.abs(b.amount)) });
  }
  // 5. Hausses de tarif
  for (const r of active.filter(r => r.hausse > 0 && r.grp === 'abonnement')) {
    A.push({ type: 'hausse_tarif', gravite: 'basse', titre: `Hausse de tarif : ${r.merchant}`, detail: `Passé de ${r.premierMontant.toFixed(2)} € à ${r.dernierMontant.toFixed(2)} €. Vérifiez si une formule moins chère suffit.`, ids: [r.id], gainMensuel: 0 });
  }
  // 6. Abonnements non identifiés
  for (const r of active.filter(r => !r.identifie)) {
    A.push({ type: 'non_identifie', gravite: 'moyenne', titre: `Prélèvement récurrent non identifié : ${r.merchant}`, detail: `« ${r.sampleLabel} » — ${r.dernierMontant.toFixed(2)} € (${r.periodicite}). Abonnement oublié ? Vérifiez son utilité.`, ids: [r.id], gainMensuel: 0 });
  }
  // 7. Frais bancaires
  const fe = txs.filter(t => t.cat === 'frais_evitable' && t.amount < 0), fo = txs.filter(t => t.cat === 'frais_optimisable' && t.amount < 0);
  const sFe = -fe.reduce((s, t) => s + t.amount, 0) / nb, sFo = -fo.reduce((s, t) => s + t.amount, 0) / nb;
  if (sFe > 0) A.push({ type: 'frais_evitables', gravite: 'haute', titre: 'Frais bancaires évitables', detail: `${fe.length} opération(s) (commissions d'intervention, agios, rejets…) soit ${(sFe * 12).toFixed(0)} €/an. Mettez en place une alerte de solde, négociez une autorisation de découvert ou un plafonnement (offre « clientèle fragile » le cas échéant).`, ids: [], gainMensuel: round2(sFe) });
  if (sFo > 2) A.push({ type: 'frais_offre', gravite: 'moyenne', titre: 'Cotisation carte / tenue de compte', detail: `${(sFo * 12).toFixed(0)} €/an de frais fixes. Plusieurs banques en ligne proposent compte et carte sans frais sous conditions d'usage.`, ids: [], gainMensuel: round2(sFo) });
  // 8. Télécom
  const tel = active.filter(r => r.cat === 'telecom'), telTot = tel.reduce((s, r) => s + mp(r), 0);
  const pers = (+profile.adultes || 1) + (+profile.enfantsPlus14 || 0);
  if (telTot > 30 * pers + 20) A.push({ type: 'telecom', gravite: 'basse', titre: 'Budget télécom élevé', detail: `${telTot.toFixed(2)} €/mois (${tel.map(r => r.merchant).join(', ')}). Comparez les offres sans engagement. Gain estimé avec l'hypothèse d'une baisse de ${CONFIG.hypotheseRenegoTelecom * 100} %.`, ids: tel.map(r => r.id), gainMensuel: round2(telTot * CONFIG.hypotheseRenegoTelecom) });
  const order = { haute: 0, moyenne: 1, basse: 2 };
  return A.sort((a, b) => order[a.gravite] - order[b.gravite]);
}

function buildSavingsPlan(recurring, anomalies, flags, revenuMensuel) {
  const items = [];
  const flagged = new Set(Object.keys(flags).filter(k => flags[k]));
  for (const r of recurring.filter(r => flagged.has(r.id)))
    items.push({ action: `Résilier ${r.merchant}`, motif: 'Marqué comme peu ou pas utilisé', mensuel: mp(r), ponctuel: 0 });
  for (const a of anomalies) {
    if (!a.gainMensuel && !a.gainPonctuel) continue;
    // évite le double comptage avec les résiliations choisies
    let gm = a.gainMensuel || 0;
    if (a.ids.length && a.ids.some(id => flagged.has(id))) {
      const rest = recurring.filter(r => a.ids.includes(r.id) && !flagged.has(r.id));
      gm = ['doublon_assurance', 'cumul_streaming', 'doublon_cloud'].includes(a.type) && rest.length >= 2
        ? rest.reduce((s, r) => s + mp(r), 0) - Math.max(...rest.map(r => mp(r))) : (a.type === 'double_prelevement' ? 0 : 0);
      if (a.type === 'double_prelevement') gm = 0;
      if (!gm && !a.gainPonctuel) continue;
    }
    items.push({ action: a.titre, motif: a.detail, mensuel: round2(gm), ponctuel: a.gainPonctuel || 0 });
  }
  const totalMensuel = round2(items.reduce((s, i) => s + i.mensuel, 0));
  const totalPonctuel = round2(items.reduce((s, i) => s + i.ponctuel, 0));
  const ratio = revenuMensuel > 0 ? totalMensuel / revenuMensuel : 0;
  const score = Math.min(100, Math.round(ratio / CONFIG.scoreFuite100 * 100));
  const niveau = score < 20 ? 'Faible' : score < 50 ? 'Modéré' : score < 80 ? 'Élevé' : 'Critique';
  return { items: items.sort((a, b) => b.mensuel * 12 + b.ponctuel - (a.mensuel * 12 + a.ponctuel)), totalMensuel, totalAnnuel: round2(totalMensuel * 12), totalPonctuel, score, niveau, ratio };
}

/* ---------- Diagnostic financier ---------- */
function tmi(rfr, parts) {
  if (!rfr || !parts) return null;
  const q = rfr / parts; for (const [plafond, taux] of CONFIG.bareme.tranches) if (q <= plafond) return taux; return 0.45;
}
const sumKeys = (p, ks) => ks.reduce((s, k) => s + (+p[k] || 0), 0);
const LIQUIDE = ['livretA', 'ldds', 'lep', 'livretsAutres'];
const age = p => +p.age1 || null;
// ctx : { part, shared:Set(merchant), externes:[{label,cat,montant}] } pour la colocation
function diagnose(txs, profile, ctx = {}) {
  const nb = months(txs), part = ctx.part ?? 1, shared = ctx.shared || new Set();
  const f = t => shared.has(t.merchant) ? part : 1;           // quote-part personnelle
  const parCat = {}, parGrp = { contrainte: 0, abonnement: 0, courant: 0, frais: 0, epargne: 0 };
  let partageAutres = 0;                                      // part des colocs sur ce que je paie
  for (const t of txs) if (t.amount < 0 && parGrp[t.grp] != null) {
    const v = -t.amount / nb * f(t);
    parCat[t.cat] = (parCat[t.cat] || 0) + v; parGrp[t.grp] += v;
    if (shared.has(t.merchant)) partageAutres += -t.amount / nb * (1 - part);
  }
  let externesPart = 0;
  for (const e of ctx.externes || []) {
    const v = (+e.montant || 0) * part; if (!v) continue;
    externesPart += v; parCat[e.cat] = (parCat[e.cat] || 0) + v; parGrp[CAT_GRP[e.cat] || 'contrainte'] += v;
  }
  const recu = txs.filter(t => t.cat === 'coloc_recu').reduce((s, t) => s + t.amount, 0) / nb;
  const envoye = -txs.filter(t => t.cat === 'coloc_envoye').reduce((s, t) => s + t.amount, 0) / nb;
  const coloc = ctx.part != null && ctx.part < 1 ? { attendu: partageAutres - externesPart, reel: recu - envoye, recu, envoye, ecart: (recu - envoye) - (partageAutres - externesPart) } : null;

  const revenusDetectes = txs.filter(t => t.amount > 0 && t.grp === 'revenu').reduce((s, t) => s + t.amount, 0) / nb;
  const revenusDeclares = (+profile.net1 || 0) + (+profile.net2 || 0) + (+profile.autresRevenus || 0);
  const revenus = revenusDeclares > 0 ? revenusDeclares : revenusDetectes;
  const { contrainte: contraintes, abonnement: abonnements, courant, frais, epargne: epargneVersee } = parGrp;
  const credit = Math.max(parCat.credit || 0, +profile.mensualitesCredit || 0);
  const depenses = contraintes + abonnements + courant + frais;
  const resteAVivre = revenus - contraintes - frais;
  const uc = 1 + Math.max(0, (+profile.adultes || 1) - 1) * 0.5 + (+profile.enfantsPlus14 || 0) * 0.5 + (+profile.enfantsMoins14 || 0) * 0.3;
  const moisCible = CONFIG.moisPrecaution[profile.statut] || 3;
  const essentiels = contraintes + frais + (parCat.alimentation || 0) + (parCat.transport || 0) + (parCat.sante_courant || 0);
  const epargneDispo = sumKeys(profile, LIQUIDE);
  const epargneInvestie = sumKeys(profile, ['avMontant', 'perMontant', 'ctoMontant', 'epSalMontant']) + (+profile.peaValeur || +profile.peaVersements || 0);
  return {
    nbMois: nb, revenus, revenusDetectes, revenusDeclares, contraintes, abonnements, courant, frais, epargneVersee, depenses,
    resteAVivre, resteAVivreUC: resteAVivre / uc, uc, capaciteEpargne: revenus - depenses,
    tauxEpargne: revenus > 0 ? (revenus - depenses) / revenus : 0,
    tauxEndettement: revenus > 0 ? credit / revenus : 0, credit,
    precautionCible: essentiels * moisCible, moisCible, essentiels,
    epargneDispo, epargneInvestie, tmi: tmi(+profile.rfr, +profile.parts), parCat, coloc
  };
}

/* ---------- Bilan par enveloppe (règles différentes selon l'âge, l'ancienneté, la TMI) ---------- */
function envelopes(d, p) {
  const P = CONFIG.plafonds, A = age(p), an = new Date().getFullYear(), out = [];
  const fill = (v, max) => max ? Math.min(1, v / max) : null;
  const add = (o) => out.push(o);
  add({ nom: 'Livret A', montant: +p.livretA || 0, liquidite: 'Disponible', plafond: P.livretA, remplissage: fill(+p.livretA || 0, P.livretA),
    note: (+p.livretA || 0) >= P.livretA ? 'Plafond atteint : les versements suivants vont sur le LDDS.' : 'Support n°1 de l\'épargne de précaution (net d\'impôt, disponible).' });
  add({ nom: 'LDDS', montant: +p.ldds || 0, liquidite: 'Disponible', plafond: P.ldds, remplissage: fill(+p.ldds || 0, P.ldds), note: 'Même rémunération et fiscalité que le Livret A.' });
  const lepEligibleProbable = d.tmi != null && d.tmi <= 0.11;
  add({ nom: 'LEP', montant: +p.lep || 0, liquidite: 'Disponible', plafond: P.lep, remplissage: fill(+p.lep || 0, P.lep),
    note: (+p.lep || 0) > 0 ? 'Le mieux rémunéré des livrets : à remplir en priorité tant que vous restez éligible.' : lepEligibleProbable ? 'Vous êtes peut-être éligible (plafond de RFR selon le nombre de parts, voir service-public.fr). Mieux rémunéré que le Livret A.' : 'Réservé aux revenus modestes (condition de RFR).' });
  if (+p.livretsAutres) add({ nom: 'Autres livrets / comptes à terme', montant: +p.livretsAutres, liquidite: 'Disponible', note: 'Livrets bancaires fiscalisés : moins intéressants que les livrets réglementés tant que ceux-ci ne sont pas pleins.' });
  // PEA
  const peaV = +p.peaVersements || 0, peaAnc = +p.peaAnnee ? an - +p.peaAnnee : null;
  add({ nom: 'PEA', montant: +p.peaValeur || peaV, liquidite: peaAnc == null ? '—' : peaAnc >= CONFIG.peaAnsExo ? 'Retraits possibles' : `Bloqué conseillé jusqu'en ${+p.peaAnnee + CONFIG.peaAnsExo}`,
    plafond: P.pea, remplissage: fill(peaV, P.pea),
    note: !p.peaAnnee && !peaV ? 'Pas de PEA : l\'ouvrir dès maintenant (même avec un petit versement) lance le compteur des 5 ans.' :
      peaAnc < CONFIG.peaAnsExo ? `Ouvert depuis ${peaAnc} an(s). Un retrait avant ${CONFIG.peaAnsExo} ans entraîne en principe la clôture et la flat tax sur les gains (sauf exceptions légales).` :
      `Plus de ${CONFIG.peaAnsExo} ans : gains exonérés d'impôt sur le revenu (prélèvements sociaux dus), retraits partiels sans clôture. Plafond calculé sur les versements, pas sur la valeur.` });
  // Assurance-vie
  const avAnc = +p.avAnnee ? an - +p.avAnnee : null;
  let avNote = !p.avMontant && !p.avAnnee ? 'Pas d\'assurance-vie : en ouvrir une tôt « prend date » pour l\'avantage fiscal des 8 ans.' :
    avAnc != null && avAnc >= CONFIG.avAnsFiscalite ? `Plus de ${CONFIG.avAnsFiscalite} ans : abattement annuel sur les gains retirés (${CONFIG.avAbattementGains.seul.toLocaleString('fr-FR')} € seul / ${CONFIG.avAbattementGains.couple.toLocaleString('fr-FR')} € en couple).` :
    avAnc != null ? `Ouverte depuis ${avAnc} an(s) : fiscalité allégée à partir de ${CONFIG.avAnsFiscalite} ans (${+p.avAnnee + CONFIG.avAnsFiscalite}).` : 'Indiquez l\'année d\'ouverture pour le calcul des 8 ans.';
  if (A && A >= 70) avNote += ` Versements après 70 ans : abattement successoral global de ${CONFIG.avTransmission.apres70.toLocaleString('fr-FR')} € sur les primes, mais les gains sont exonérés.`;
  else if (A && A >= 60) avNote += ` Avant 70 ans, les versements bénéficient d'un abattement de ${CONFIG.avTransmission.avant70.toLocaleString('fr-FR')} € par bénéficiaire : à anticiper si la transmission compte.`;
  add({ nom: 'Assurance-vie', montant: +p.avMontant || 0, liquidite: 'Disponible (rachat)', note: avNote });
  // PER
  let perNote;
  if (p.statut === 'retraite') perNote = 'À la retraite, le PER se débloque (capital ou rente) ; de nouveaux versements ont rarement un intérêt.';
  else if (d.tmi == null) perNote = 'Renseignez RFR et parts pour évaluer l\'intérêt fiscal.';
  else if (d.tmi <= 0.11) perNote = `TMI estimée ${Math.round(d.tmi * 100)} % : économie d'impôt faible pour une épargne bloquée jusqu'à la retraite. Peu prioritaire.`;
  else if (A && A < 35) perNote = `TMI ${Math.round(d.tmi * 100)} % mais blocage d'environ ${64 - A} ans : intéressant surtout si vous visez l'achat de la résidence principale (cas de déblocage anticipé), sinon PEA/AV plus souples.`;
  else perNote = `TMI ${Math.round(d.tmi * 100)} % : chaque 100 € versé réduit l'impôt d'environ ${Math.round(d.tmi * 100)} € (dans le plafond indiqué sur l'avis). Capital fiscalisé à la sortie.`;
  add({ nom: 'PER', montant: +p.perMontant || 0, liquidite: 'Bloqué jusqu\'à la retraite*', note: perNote });
  if (+p.epSalMontant) add({ nom: 'Épargne salariale (PEE/PERCOL)', montant: +p.epSalMontant, liquidite: 'Bloqué 5 ans (PEE) / retraite', note: 'Si votre employeur abonde, c\'est souvent le meilleur rendement garanti : versez au moins le montant qui déclenche l\'abondement maximal.' });
  if (+p.ctoMontant) add({ nom: 'Compte-titres (CTO)', montant: +p.ctoMontant, liquidite: 'Disponible', note: 'Aucun avantage fiscal (flat tax). À réserver à ce qui ne rentre pas dans le PEA ou l\'assurance-vie.' });
  return out;
}

function advise(d, p) {
  const C = [], manque = d.precautionCible - d.epargneDispo;
  if (manque > 0) C.push({ prio: 1, titre: 'Priorité : l\'épargne de précaution', texte: `Objectif ≈ ${Math.round(d.precautionCible).toLocaleString('fr-FR')} € (${d.moisCible} mois de dépenses essentielles, statut « ${p.statut || '?'} »). Il manque ≈ ${Math.round(manque).toLocaleString('fr-FR')} € sur vos livrets. Seuls les livrets comptent ici : PEA, PER et assurance-vie en unités de compte peuvent baisser ou être bloqués.`, enveloppes: ['LEP', 'Livret A', 'LDDS'] });
  else C.push({ prio: 3, titre: 'Épargne de précaution constituée ✔', texte: 'Le surplus peut être investi à plus long terme : voir l\'onglet Stratégie.', enveloppes: [] });
  if (d.tauxEndettement > CONFIG.seuilEndettement) C.push({ prio: 1, titre: 'Endettement au-dessus de 35 %', texte: `Crédits = ${(d.tauxEndettement * 100).toFixed(0)} % des revenus. Avant tout placement à risque : renégocier ou regrouper, et éviter tout nouveau crédit à la consommation.`, enveloppes: [] });
  if (d.tauxEpargne < 0.05) C.push({ prio: 2, titre: 'Capacité d\'épargne faible', texte: 'Programmez un virement automatique le jour de la paie (même 30 à 50 €) et appliquez le plan d\'économies.', enveloppes: [] });
  if (d.coloc && Math.abs(d.coloc.ecart) > 10) C.push({ prio: 2, titre: 'Colocation : remboursements à régulariser', texte: `Écart moyen de ${Math.round(Math.abs(d.coloc.ecart))} €/mois entre ce que la répartition prévoit et les virements reçus/envoyés (${d.coloc.ecart < 0 ? 'en votre défaveur' : 'en votre faveur'}). Vérifiez le solde Tricount.`, enveloppes: [] });
  return C.sort((a, b) => a.prio - b.prio);
}

/* ---------- Stratégie d'investissement (PEA & co.) ---------- */
function horizonKey(years) { return years < 3 ? 'court' : years < 8 ? 'moyen' : 'long'; }
function project(initial, mensuel, years, tauxAnnuel, fraisAnnuel = 0) {
  const r = Math.pow(1 + (tauxAnnuel - fraisAnnuel) / 100, 1 / 12) - 1, serie = [initial]; let v = initial;
  for (let m = 1; m <= years * 12; m++) { v = v * (1 + r) + mensuel; serie.push(v); }
  return serie;
}
function investPlan(d, p, inv) {
  const years = Math.max(1, +inv.horizon || 10), tol = p.tolerance || 'prudent', hk = horizonKey(years);
  const pctActions = CONFIG.allocActions[hk][tol] / 100;
  const manque = Math.max(0, d.precautionCible - d.epargneDispo);
  const versement = Math.max(0, +inv.mensuel || 0), initial = Math.max(0, +inv.initial || 0);
  // si la précaution n'est pas faite, le versement mensuel va d'abord aux livrets
  const moisPrecaution = manque > 0 && versement > 0 ? Math.ceil(manque / versement) : manque > 0 ? Infinity : 0;
  const actionsM = versement * pctActions, secuM = versement - actionsM;
  const actionsI = initial * pctActions, secuI = initial - actionsI;
  const peaReste = Math.max(0, CONFIG.plafonds.pea - (+p.peaVersements || 0));
  const moisAvantPlafond = actionsM > 0 ? Math.max(0, (peaReste - actionsI) / actionsM) : Infinity;
  const R = CONFIG.rendements, mix = t => pctActions * t + (1 - pctActions) * R.securise;
  const scen = k => project(initial, versement, years, mix(R[k]), pctActions * (+inv.fraisEtf || 0));
  const verses = Array.from({ length: years * 12 + 1 }, (_, m) => initial + versement * m);
  const fraisChers = project(initial, versement, years, mix(R.median), pctActions * (+inv.fraisFonds || 0));
  const med = scen('median');
  const ordre = [
    { etape: 'Épargne de précaution sur livrets', ok: manque <= 0, detail: manque > 0 ? `Encore ${Math.round(manque).toLocaleString('fr-FR')} € à placer (≈ ${isFinite(moisPrecaution) ? moisPrecaution + ' mois' : '—'} au rythme choisi).` : 'Faite.' },
    { etape: 'Rembourser les crédits à la consommation chers', ok: !(d.parCat.credit > 0) || d.tauxEndettement < 0.1, detail: 'Un crédit à 6-8 % coûte plus qu\'un placement ne rapporte en moyenne.' },
    { etape: 'Abondement employeur (épargne salariale)', ok: null, detail: 'Si disponible : versez au moins le montant qui déclenche l\'abondement maximal.' },
    { etape: 'PEA : poche actions long terme', ok: !!(+p.peaVersements || +p.peaAnnee), detail: years >= CONFIG.peaAnsExo ? 'Adapté à votre horizon (≥ 5 ans).' : 'Horizon < 5 ans : PEA déconseillé pour ce projet.' },
    { etape: 'Assurance-vie : poche sécurisée (fonds euros) + diversification', ok: !!(+p.avMontant), detail: 'Souplesse, transmission, et fonds euros pour la part sans risque.' },
    { etape: 'PER si TMI ≥ 30 %', ok: null, detail: d.tmi != null ? `TMI estimée ${Math.round(d.tmi * 100)} %${d.tmi >= 0.3 ? ' : pertinent.' : ' : peu prioritaire.'}` : 'TMI inconnue.' }
  ];
  const coeur = tol === 'prudent' ? 100 : tol === 'equilibre' ? 90 : 80;
  return { years, hk, tol, pctActions, actionsM, secuM, actionsI, secuI, peaReste, moisAvantPlafond, ordre, moisPrecaution, manque,
    poche: { coeur, satellite: 100 - coeur },
    series: { pessimiste: scen('pessimiste'), median: med, optimiste: scen('optimiste'), verses, fraisChers },
    finals: { pessimiste: scen('pessimiste').at(-1), median: med.at(-1), optimiste: scen('optimiste').at(-1), verses: verses.at(-1), fraisChers: fraisChers.at(-1) } };
}

global.Engine = { parseOFX, parseStatementRows, classifyPdf, parseSavingsStatement, coverage, infer, savingsType, CONFIG, CAT_LABELS, CAT_GRP, parseAmount, parseDate, parseCSV, parseStatementLines, parseAvisImposition, parseFichePaie, categorize, detectRecurring, detectAnomalies, buildSavingsPlan, diagnose, envelopes, advise, investPlan, tmi, monthKey };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

(function () {

/* ---------- Appareil ---------- */
function detectDevice() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}

/* ---------- Pipeline d'analyse ---------- */
const isColoc = () => S.profile.profilType === 'colocation';
const colocPart = () => { const p = S.profile; const v = +p.colocPart; return v > 0 && v <= 100 ? v / 100 : 1 / ((+p.colocNb || 1) + 1); };
const normAlias = a => a.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
function compute() {
  const p = S.profile, coloc = isColoc();
  const aliases = coloc ? String(p.colocAliases || '').split(/[,;]/).map(normAlias).filter(Boolean) : [];
  const txs = S.raw.map(t => E.categorize(t, { colocAliases: aliases }));
  const part = coloc ? colocPart() : 1, sharedSet = new Set(coloc ? Object.keys(S.shared).filter(k => S.shared[k]) : []);
  const recurring = E.detectRecurring(txs).map(r => ({ ...r, part: sharedSet.has(r.merchant) ? part : 1 }));
  const anomalies = E.detectAnomalies(txs, recurring, p);
  const d = E.diagnose(txs, p, coloc ? { part, shared: sharedSet, externes: p.externes } : {});
  const plan = E.buildSavingsPlan(recurring, anomalies, S.flags, d.revenus);
  return { txs, recurring, anomalies, d, plan, part, coloc };
}

function modal({ title, body = '', input = null, ok = 'Valider', cancel = 'Annuler', danger = false }) {
  return new Promise(res => {
    $('#modal-root').innerHTML = `<div class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4 fade">
      <form class="card w-full max-w-md" id="mform"><h3 class="text-lg font-semibold">${title}</h3><div class="text-sm text-slate-600 mt-2">${body}</div>
      ${input ? `<input id="minput" type="${input}" class="inp mt-4" autocomplete="off">` : ''}
      <div class="flex justify-end gap-2 mt-5">${cancel ? `<button type="button" id="mcancel" class="btn-ghost">${cancel}</button>` : ''}<button class="btn-primary ${danger ? '!bg-none !bg-red-600' : ''}">${ok}</button></div></form></div>`;
    const close = v => { $('#modal-root').innerHTML = ''; res(v); };
    $('#mform').onsubmit = e => { e.preventDefault(); close(input ? $('#minput').value : true); };
    const c = $('#mcancel'); if (c) c.onclick = () => close(null);
    const i = $('#minput'); if (i) setTimeout(() => i.focus(), 50);
  });
}
function toast(t, tone = 'blue') {

/* ---------- Lecture des documents (sur l'appareil) ---------- */
let pdfjsPromise = null;
function loadPdfJs() {
  if (pdfjsPromise) return pdfjsPromise;
  const tryLoad = async () => {
    try { const lib = await import('./vendor/pdf.min.mjs'); lib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href; return lib; }
    catch (e) { const lib = await import(E.CONFIG.pdfjs.lib); lib.GlobalWorkerOptions.workerSrc = E.CONFIG.pdfjs.worker; return lib; }
  };
  return (pdfjsPromise = tryLoad().catch(e => { pdfjsPromise = null; throw new Error('le lecteur PDF n\'a pas pu se charger (connexion nécessaire la première fois)'); }));
}
async function openPdf(lib, bytes, name) {
  let password;
  for (let k = 0; k < 4; k++) {
    try { return await lib.getDocument({ data: bytes.slice(), password, isEvalSupported: false, disableFontFace: true, verbosity: 0 }).promise; }
    catch (e) {
      if (e && e.name === 'PasswordException') {
        password = await modal({ title: '🔐 Document protégé', body: `« ${esc(name)} » est protégé par un mot de passe${k ? ' <b class="text-red-600">(incorrect, réessayez)</b>' : ''}. Il reste sur cet appareil.`, input: 'password', ok: 'Ouvrir' });
        if (password == null) throw new Error('mot de passe non fourni');
      } else throw e;
    }
  }
  throw new Error('mot de passe incorrect');
}
async function pdfToRows(file) {
  const lib = await loadPdfJs();
  const doc = await openPdf(lib, new Uint8Array(await file.arrayBuffer()), file.name);
  const rows = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent(), pr = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], h = Math.abs(it.transform[3]) || 8;
      let row = pr.find(r => Math.abs(r.y - y) < Math.max(2, h * 0.45));
      if (!row) pr.push(row = { y, items: [] });
      row.items.push({ x: it.transform[4], w: it.width || 0, str: it.str });
    }
    pr.sort((a, b) => b.y - a.y).forEach(r => { r.items.sort((a, b) => a.x - b.x); rows.push({ text: r.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim(), items: r.items }); });
  }
  S.pdfDebug = { name: file.name, text: rows.map(r => r.text).join('\n').slice(0, 8000) };
  if (rows.map(r => r.text).join('').replace(/\s/g, '').length < 30) throw new Error('ce PDF ne contient pas de texte (scan ou photo)');
  return rows;
}
async function readText(f) {
  const buf = await f.arrayBuffer(), utf = new TextDecoder('utf-8').decode(buf);
  return utf.includes(String.fromCharCode(0xFFFD)) ? new TextDecoder('windows-1252').decode(buf) : utf;
}
function addTx(list) {
  const key = t => +t.date + '|' + t.label + '|' + t.amount, seen = new Set(S.raw.map(key));
  const fresh = list.filter(t => !seen.has(key(t))); S.raw.push(...fresh.map(t => ({ ...t, docId: S.docs.length }))); return { added: fresh.length, skipped: list.length - fresh.length };
}
const SAV_FIELD = { livretA: 'livretA', ldds: 'ldds', lep: 'lep', livretsAutres: 'livretsAutres', pea: 'peaValeur', av: 'avMontant', per: 'perMontant' };
const SAV_LABEL = { livretA: 'Livret A', ldds: 'LDDS', lep: 'LEP', livretsAutres: 'Livret', pea: 'PEA', av: 'Assurance-vie', per: 'PER' };
const docMsg = (t, tone = 'slate') => { const m = $('#docMsg'); if (m) m.innerHTML = `<span class="text-${tone}-700">${t}</span>`; };
async function handleFiles(files) {
  for (const f of files) {
    docMsg(`⏳ Lecture de ${esc(f.name)}…`, 'blue');
    const doc = { name: f.name, ok: true, warnings: [] };
    try {
      if (/\.(jpe?g|png|heic|webp)$/i.test(f.name)) throw new Error('une photo ne peut pas être lue : téléchargez le PDF depuis l\'appli de la banque');
      if (/\.(ofx|qfx)$/i.test(f.name)) {
        const r = E.parseOFX(await readText(f), f.name), { added, skipped } = addTx(r.transactions), sav = r.accounts.filter(a => a.savings && a.solde != null);
        sav.forEach(a => S.profile[SAV_FIELD[a.type]] = a.solde);
        Object.assign(doc, { kind: added ? 'releve' : 'epargne', detail: [added ? `${added} opérations` : '', skipped ? `${skipped} déjà importées` : '', ...sav.map(a => `${SAV_LABEL[a.type]} : ${eur(a.solde, 0)}`)].filter(Boolean).join(' · ') || 'Fichier vide', warnings: r.warnings });
      } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
        const rows = await pdfToRows(f), lines = rows.map(r => r.text), kind = E.classifyPdf(lines);
        if (kind === 'avis') { const r = E.parseAvisImposition(lines); if (r.rfr) S.profile.rfr = r.rfr; if (r.parts) S.profile.parts = r.parts; Object.assign(doc, { kind, ok: !!r.rfr, detail: r.rfr ? `Avis d'impôt : RFR ${r.rfr.toLocaleString('fr-FR')} €, ${r.parts ?? '?'} part(s)` : 'Avis reconnu, mais RFR introuvable' }); }
        else if (kind === 'paie') { const r = E.parseFichePaie(lines); Object.assign(doc, { kind, ok: !!r.net, net: r.net, detail: r.net ? `Fiche de paie : net versé ${eur(r.net, 2)}` : 'Fiche de paie reconnue, mais net introuvable' }); S.applied = false; }
        else if (kind === 'epargne') { const r = E.parseSavingsStatement(lines); if (r.solde != null) S.profile[SAV_FIELD[r.type]] = r.solde; Object.assign(doc, { kind, ok: r.solde != null, detail: r.solde != null ? `${SAV_LABEL[r.type]} : solde ${eur(r.solde, 0)}` : `Relevé d'épargne (${SAV_LABEL[r.type]}), solde introuvable` }); }
        else { const r = E.parseStatementRows(rows, f.name), { added, skipped } = addTx(r.transactions); Object.assign(doc, { kind: 'releve', ok: added + skipped > 0, detail: `Relevé : ${added} opérations${skipped ? ` · ${skipped} déjà importées` : ''}`, warnings: r.warnings }); }
      } else {
        const r = E.parseCSV(await readText(f), f.name), { added, skipped } = addTx(r.transactions);
        Object.assign(doc, { kind: 'releve', ok: added + skipped > 0, detail: `Relevé : ${added} opérations${skipped ? ` · ${skipped} déjà importées` : ''}`, warnings: r.warnings });
      }
    } catch (e) { Object.assign(doc, { kind: 'erreur', ok: false, detail: 'Illisible : ' + esc(e.message) }); }
    S.docs.push(doc); S.applied = false;
  }
  renderWizard();
  const last = S.docs[S.docs.length - 1]; if (last) docMsg(last.ok ? '✅ Document(s) ajouté(s).' : '⚠️ ' + last.detail, last.ok ? 'emerald' : 'red');
}
function removeDoc(i) {
  S.raw = S.raw.filter(t => t.docId !== i).map(t => ({ ...t, docId: t.docId > i ? t.docId - 1 : t.docId }));
  S.docs.splice(i, 1); S.applied = false; renderWizard();
}

const SAVE_KEY = 'auditBudget.save.v1';
const hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; } };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(code, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function save() {
  const code = await modal({ title: '💾 Enregistrer sur cet appareil', body: 'Choisissez un code (6 caractères minimum). Il chiffre votre audit : sans lui, personne ne peut le lire, et il ne peut pas être récupéré en cas d\'oubli.', input: 'password', ok: 'Chiffrer et enregistrer' });
  if (code == null) return; if (code.length < 6) return toast('Code trop court (6 caractères minimum).', 'red');
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const { pdfDebug, ...keep } = S;
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFrom(code, salt), new TextEncoder().encode(JSON.stringify(keep)));
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), data: b64(data), date: new Date().toISOString() }));
    toast('✅ Audit chiffré et enregistré sur cet appareil.');
  } catch (e) { toast('Enregistrement impossible dans ce navigateur (' + esc(e.message) + ').', 'red'); }
}
async function restore() {
  let blob; try { blob = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return toast('Aucune sauvegarde lisible.', 'red'); }
  const code = await modal({ title: '↺ Reprendre mon audit', body: `Sauvegarde du ${new Date(blob.date).toLocaleDateString('fr-FR')}. Saisissez votre code.`, input: 'password', ok: 'Déverrouiller' });
  if (code == null) return;
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, await keyFrom(code, unb64(blob.salt)), unb64(blob.data));
    const st = JSON.parse(new TextDecoder().decode(plain));
    st.raw.forEach(t => t.date = new Date(t.date)); S = { ...fresh(), ...st, device: detectDevice() };
    toast('✅ Audit déverrouillé.'); render();
  } catch { toast('Code incorrect.', 'red'); }
}
async function wipe() {
  const ok = await modal({ title: 'Tout effacer ?', body: 'Les données de la session et la sauvegarde chiffrée de cet appareil seront supprimées.', ok: 'Tout effacer', danger: true });
  if (!ok) return; try { localStorage.removeItem(SAVE_KEY); } catch { } S = fresh(); render(); toast('Données effacées.');
}

  return `<svg viewBox="0 0 200 120" class="w-full max-w-[220px] mx-auto"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round"/>
    ${score > 0 ? `<path d="M20 100 A80 80 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"/>` : ''}
    <text x="100" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="${col}">${score}</text><text x="100" y="112" text-anchor="middle" font-size="11" fill="#64748b">${niveau}</text></svg>`;
}

const PALETTE = { contrainte: '#2563eb', abonnement: '#f59e0b', courant: '#94a3b8', frais: '#ef4444', epargne: '#6366f1', reste: '#cbd5e1' };
function donut(parts) {
  const tot = parts.reduce((s, p) => s + Math.max(0, p.v), 0) || 1; let acc = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => {
    const a0 = acc / tot * 2 * Math.PI, a1 = (acc += p.v) / tot * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0;
    const P = a => [80 + 60 * Math.sin(a), 80 - 60 * Math.cos(a)].map(n => n.toFixed(2)).join(' ');
    return a1 - a0 >= 2 * Math.PI - 1e-6 ? `<circle cx="80" cy="80" r="60" fill="none" stroke="${p.c}" stroke-width="26"/>` : `<path d="M ${P(a0)} A 60 60 0 ${big} 1 ${P(a1)}" fill="none" stroke="${p.c}" stroke-width="26"/>`;
  }).join('');
  return `<div class="flex items-center gap-6 flex-wrap"><svg viewBox="0 0 160 160" class="w-40 h-40">${arcs}</svg>
    <ul class="text-sm space-y-1">${parts.map(p => `<li class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:${p.c}"></span>${p.l} <b class="ml-auto pl-4">${eur(p.v, 0)}</b><span class="text-xs text-slate-400 w-10 text-right">${pct(Math.max(0, p.v) / tot)}</span></li>`).join('')}</ul></div>`;
}
function bars(rows) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return rows.map(r => `<div class="flex items-center gap-2 text-xs mb-1.5"><span class="w-40 truncate text-slate-600">${esc(r.l)}</span><div class="flex-1 bg-slate-100 rounded h-3"><div class="h-3 rounded" style="width:${(r.v / max * 100).toFixed(1)}%;background:${r.c}"></div></div><span class="w-20 text-right font-medium">${eur(r.v, 0)}</span></div>`).join('');
}

/* ---------- 4. STRATÉGIE D'INVESTISSEMENT ---------- */
function lineChart(series, n) {
  const W = 640, H = 240, pad = 44, all = series.flatMap(s => s.data), min = Math.min(0, ...all), max = Math.max(...all, 1);
  const X = i => pad + i / n * (W - pad - 10), Y = v => H - 25 - (v - min) / (max - min || 1) * (H - 45);
  const path = d => d.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const yrs = n / 12, step = yrs > 20 ? 5 : yrs > 10 ? 2 : 1;
  const ticks = Array.from({ length: Math.floor(yrs / step) + 1 }, (_, k) => k * step).map(a => `<text x="${X(a * 12)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#94a3b8">${a} an${a > 1 ? 's' : ''}</text>`).join('');
  const yt = [min, (min + max) / 2, max].map(v => `<text x="${pad - 4}" y="${Y(v) + 3}" font-size="10" text-anchor="end" fill="#94a3b8">${Math.round(v / 1000)} k€</text><line x1="${pad}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f1f5f9"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full">${yt}${ticks}
    ${series.map(s => `<path d="${path(s.data)}" fill="none" stroke="${s.c}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="6 4"' : ''}/>`).join('')}</svg>
    <div class="flex flex-wrap gap-4 text-xs mt-1">${series.map(s => `<span class="flex items-center gap-1"><span class="w-4 h-0.5 inline-block" style="background:${s.c}"></span>${s.l}</span>`).join('')}</div>`;
}

  if (inv.mensuel == null) inv.mensuel = Math.max(0, Math.round((d.capaciteEpargne + plan.totalMensuel) * 0.7 / 10) * 10);
  if (inv.horizon == null) inv.horizon = { court: 2, moyen: 6, long: 15 }[p.horizon] || 10;
  const P = E.investPlan(d, p, inv), R = E.CONFIG.rendements, an = new Date().getFullYear();
  const ni = (k, step = 'any') => `<input type="number" step="${step}" min="0" data-inv="${k}" value="${inv[k]}" class="${inputCls}">`;
  const tolLabel = { prudent: 'prudent', equilibre: 'équilibré', dynamique: 'dynamique' }[P.tol];

    <div class="grid md:grid-cols-2 gap-5">
      ${card(`<h2 class="font-semibold mb-3">Dans quel ordre placer ?</h2><ol class="space-y-2">${P.ordre.map((o, k) => `<li class="flex gap-3"><span class="w-6 h-6 shrink-0 rounded-full text-xs flex items-center justify-center ${o.ok === true ? 'bg-emerald-600 text-white' : o.ok === false ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-600'}">${o.ok === true ? '✓' : k + 1}</span><div><b class="text-sm">${esc(o.etape)}</b><p class="text-xs text-slate-500">${esc(o.detail)}</p></div></li>`).join('')}</ol>`)}

        <table class="w-full text-sm"><thead class="text-xs text-slate-500"><tr><th class="text-left">Poche</th><th class="text-right">Mensuel</th><th class="text-right">Initial</th></tr></thead><tbody>
          <tr class="border-t"><td class="py-2"><b>Actions</b> → PEA en priorité${P.peaReste < E.CONFIG.plafonds.pea ? ` <span class="text-xs text-slate-400">(reste ${eur(P.peaReste, 0)} de plafond)</span>` : ''}</td><td class="text-right">${eur(P.actionsM, 0)}</td><td class="text-right">${eur(P.actionsI, 0)}</td></tr>
          <tr class="border-t"><td class="py-2"><b>Sécurisé</b> → livrets, puis fonds euros d'assurance-vie</td><td class="text-right">${eur(P.secuM, 0)}</td><td class="text-right">${eur(P.secuI, 0)}</td></tr></tbody></table>
        ${isFinite(P.moisAvantPlafond) && P.moisAvantPlafond < P.years * 12 ? `<p class="text-xs text-slate-500 mt-2">Plafond PEA atteint dans ≈ ${Math.round(P.moisAvantPlafond / 12)} an(s) : basculer ensuite la poche actions vers l'assurance-vie (unités de compte).</p>` : ''}`)}
    </div>

    ${card(`<h2 class="font-semibold mb-3">Construire la poche PEA : cœur + satellite</h2>
      <div class="grid md:grid-cols-3 gap-4 text-sm">
        <div class="md:col-span-2">

          <p class="mt-2"><b>Satellite (facultatif, ${P.poche.satellite ? 'max ' + P.poche.satellite + ' %' : 'déconseillé pour un profil prudent'}) :</b> actions d'entreprises européennes que vous connaissez, ou un ETF thématique/émergents pour diversifier. C'est la poche « plaisir » : si elle disparaît, la stratégie tient.</p>

          <p>③ <b>Rééquilibrer une fois par an</b> pour revenir à la part actions cible.</p>
          <p>④ <b>Sécuriser progressivement</b> dans les 3 ans précédant un besoin d'argent identifié.</p>

        </div>
      </div>

    <div class="grid md:grid-cols-3 gap-5">
      ${card(`<h2 class="font-semibold mb-2">Projection sur ${P.years} ans (illustrative)</h2>${lineChart([
        { l: `Optimiste (actions ${R.optimiste} %/an)`, data: P.series.optimiste, c: '#059669', w: 1.5 },
        { l: `Médian (${R.median} %/an)`, data: P.series.median, c: '#2563eb' },
        { l: `Pessimiste (${R.pessimiste} %/an)`, data: P.series.pessimiste, c: '#d97706', w: 1.5 },
        { l: 'Somme versée', data: P.series.verses, c: '#94a3b8', dash: true, w: 1.5 }], P.years * 12)}
        <p class="text-[11px] text-slate-400 mt-2">Rendements moyens lissés, hypothèses de la section CONFIG. En réalité la courbe fait des creux, et les performances passées ne préjugent pas des performances futures. Poche sécurisée à ${R.securise} %/an. Avant impôts et prélèvements sociaux.</p>`, 'md:col-span-2')}
      ${card(`<h2 class="font-semibold mb-2">À l'horizon</h2><table class="w-full text-sm"><tbody>
        <tr><td class="py-1">Versé</td><td class="text-right">${eur(P.finals.verses, 0)}</td></tr>
        <tr class="border-t"><td class="py-1">Pessimiste</td><td class="text-right">${eur(P.finals.pessimiste, 0)}</td></tr>
        <tr class="border-t"><td class="py-1 font-semibold">Médian</td><td class="text-right font-semibold">${eur(P.finals.median, 0)}</td></tr>
        <tr class="border-t"><td class="py-1">Optimiste</td><td class="text-right">${eur(P.finals.optimiste, 0)}</td></tr></tbody></table>
        <div class="mt-4 rounded p-3 bg-red-50 text-red-900 text-sm"><b>Coût des frais</b><br>Même scénario médian avec des fonds à ${inv.fraisFonds} % au lieu d'ETF à ${inv.fraisEtf} % : <b>${eur(P.finals.fraisChers, 0)}</b>, soit <b>${eur(P.finals.median - P.finals.fraisChers, 0)} de moins</b>.</div>`)}
    </div>
    <p class="text-[11px] text-slate-400">Outil pédagogique : il ne recommande aucun produit précis. Avant d'investir, lisez le document d'informations clés (DIC) de chaque support.</p>
  </div>`;
  document.querySelectorAll('[data-inv]').forEach(c => c.onchange = () => { inv[c.dataset.inv] = Math.max(0, +c.value || 0); renderStrategie(); });
}

/* ---------- Rapport téléchargeable (fichier HTML autonome, imprimable en PDF) ---------- */
function reportHtml() {
  const { anomalies, d, plan, recurring } = compute(), ENV = E.envelopes(d, S.profile), C = E.advise(d, S.profile);
  const r = (l, v) => `<tr><td>${l}</td><td style="text-align:right"><b>${v}</b></td></tr>`;
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon audit budget</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1e293b}h1{color:#1d4ed8}h2{border-bottom:2px solid #dbeafe;padding-bottom:4px;margin-top:28px;color:#1e3a8a}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid #e2e8f0;vertical-align:top;text-align:left}.k{display:inline-block;background:#eff6ff;border-radius:10px;padding:10px 14px;margin:4px;min-width:140px}.k b{display:block;font-size:20px;color:#1d4ed8}small{color:#64748b}</style></head><body>
<h1>Mon audit budget</h1><small>Établi le ${new Date().toLocaleDateString('fr-FR')} sur ${d.nbMois} mois de relevés · document personnel</small>
<h2>Synthèse</h2><div><span class="k">Revenus<b>${eur(d.revenus, 0)}</b></span><span class="k">Charges contraintes<b>${eur(d.contraintes + d.frais, 0)}</b></span><span class="k">Reste à vivre<b>${eur(d.resteAVivre, 0)}</b></span><span class="k">Capacité d'épargne<b>${eur(d.capaciteEpargne, 0)}</b></span><span class="k">Score de fuite<b>${plan.score}/100</b></span></div>
<h2>Plan d'économies — ${eur(plan.totalMensuel)}/mois, ${eur(plan.totalAnnuel, 0)}/an</h2><table>${plan.items.map(i => `<tr><td><b>${esc(i.action)}</b><br><small>${esc(i.motif)}</small></td><td style="text-align:right;white-space:nowrap">${i.mensuel ? eur(i.mensuel) + '/mois' : ''}${i.ponctuel ? ' ' + eur(i.ponctuel) : ''}</td></tr>`).join('')}</table>
<h2>Prélèvements récurrents</h2><table><tr><th>Prestataire</th><th>Rythme</th><th style="text-align:right">€/mois</th></tr>${recurring.map(x => `<tr><td>${esc(x.merchant)}<br><small>${esc(x.catLabel)}</small></td><td>${x.periodicite}</td><td style="text-align:right">${eur(x.mensuel * x.part, 2)}</td></tr>`).join('')}</table>
<h2>Anomalies</h2><table>${anomalies.map(a => `<tr><td><b>${esc(a.titre)}</b><br><small>${esc(a.detail)}</small></td></tr>`).join('')}</table>
<h2>Épargne</h2><table>${r('Épargne disponible', eur(d.epargneDispo, 0))}${r('Objectif de précaution', eur(d.precautionCible, 0))}${ENV.map(e => `<tr><td><b>${esc(e.nom)}</b> — ${eur(e.montant, 0)}<br><small>${esc(e.note)}</small></td></tr>`).join('')}</table>
<h2>Priorités</h2><table>${C.map(c => `<tr><td><b>${esc(c.titre)}</b><br><small>${esc(c.texte)}</small></td></tr>`).join('')}</table>
<p><small>Outil pédagogique, ne constitue pas un conseil en investissement personnalisé. Pour l'enregistrer en PDF : menu Imprimer → Enregistrer en PDF.</small></p></body></html>`;
}
async function downloadReport() {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { }
  const html = reportHtml();
  if (dl) {
    try { await dl.save({ filename: 'mon-audit-budget.html', data: new Blob([html], { type: 'text/html' }) }); return toast('✅ Rapport enregistré : ouvrez-le puis Imprimer → PDF.'); }
    catch (e) { try { await dl.save({ filename: 'mon-audit-budget.html', data: html }); return toast('✅ Rapport enregistré.'); } catch (e2) { if (e2 && /declin|cancel|abort/i.test(String(e2.message || e2.code))) return; } }
  }
  // repli : fichier local (hors page hébergée) puis copie du résumé
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'mon-audit-budget.html'; document.body.appendChild(a); a.click(); a.remove(); }
  catch { }
  const { d, plan } = compute();
  const sum = `Mon audit budget (${new Date().toLocaleDateString('fr-FR')})\nRevenus : ${eur(d.revenus, 0)}/mois\nCharges contraintes : ${eur(d.contraintes + d.frais, 0)}\nReste à vivre : ${eur(d.resteAVivre, 0)}\nCapacité d'épargne : ${eur(d.capaciteEpargne, 0)}/mois\nÉconomies possibles : ${eur(plan.totalMensuel)}/mois\n` + plan.items.map(i => `- ${i.action}${i.mensuel ? ' : ' + eur(i.mensuel) + '/mois' : ''}`).join('\n');
  try { await navigator.clipboard.writeText(sum); toast('Résumé copié dans le presse-papiers.'); } catch { }
}
